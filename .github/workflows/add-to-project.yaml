name: Add All Issues

on:
  issues:
    types:
      - opened

jobs:
  add-to-project:
    name: Add all issues to project
    runs-on: ubuntu-latest
    environment: project
    steps:
      - name: Add Issue
        uses: actions/add-to-project@5afcf98fcd03f1c2f92c3c83f58ae24323cc57fd
        with:
          project-url: https://github.com/orgs/LexisNexis-RBA/projects/55
          github-token: ${{ secrets.SECRET }}
